<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
font-family:Tajawal,Arial;
}

body{
margin:0;
background:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:90%;
max-width:400px;
text-align:center;
}

.logo{
width:90px;
height:90px;
margin:auto;
border-radius:50%;
background:#2563eb;
color:white;
font-size:45px;
display:flex;
align-items:center;
justify-content:center;
}

h1{
color:#2563eb;
font-size:35px;
}

.box{
background:#f3f4f6;
padding:20px;
border-radius:15px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:1px solid #ddd;
}

button{
width:100%;
padding:12px;
margin:8px 0;
border:0;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
}

.menu div{
margin-top:10px;
padding:15px;
border:1px solid #ddd;
border-radius:12px;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">🎓</div>

<h1>Student</h1>

<p>منصة الطالب التعليمية</p>

<div class="box">

<input id="email" type="email" placeholder="البريد الإلكتروني">

<input id="password" type="password" placeholder="كلمة المرور">

<button onclick="signup()">إنشاء حساب</button>

<button onclick="login()">تسجيل الدخول</button>

<p id="msg"></p>

</div>

<div class="menu">
<div>📚 الدروس</div>
<div>📝 الاختبارات</div>
<div>👨‍🎓 الملف الشخصي</div>
</div>

</div>


<script>

const SUPABASE_URL="https://icpcthgueabxwwevowbt.supabase.co";

const SUPABASE_KEY="sb_publishable_rg857jiJ2tgqje-odQHZIQ_2Sd0UzbD";

const supabaseClient=supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


async function signup(){

let email=document.getElementById("email").value;
let password=document.getElementById("password").value;

let {error}=await supabaseClient.auth.signUp({
email:email,
password:password
});

document.getElementById("msg").innerHTML=
error ? error.message : "تم إنشاء الحساب";

}


async function login(){

let email=document.getElementById("email").value;
let password=document.getElementById("password").value;

let {error}=await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});

document.getElementById("msg").innerHTML=
error ? error.message : "تم تسجيل الدخول";

}

</script>

</body>
</html>
