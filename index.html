<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
margin:0;
background:#ffffff;
min-height:100vh;
}

.app{
width:100%;
min-height:100vh;
padding:20px;
display:flex;
flex-direction:column;
}

.header{
text-align:center;
padding:20px;
}

.logo{
width:100px;
height:100px;
background:#2563eb;
border-radius:50%;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
color:white;
}


.box{
background:#f5f5f5;
padding:20px;
border-radius:15px;
margin-top:20px;
}

input{
width:100%;
padding:14px;
margin:8px 0;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}


button{
width:100%;
padding:15px;
margin:8px 0;
border:0;
border-radius:12px;
background:#2563eb;
color:white;
font-size:17px;
}


.menu{
margin-top:20px;
}


.page{
margin-top:20px;
padding:20px;
background:#fafafa;
border-radius:15px;
min-height:200px;
text-align:center;
}


</style>

</head>


<body>


<div class="app">


<div class="header">

<div class="logo">
🎓
</div>

<p>
منصة الطالب التعليمية
</p>

</div>



<div class="box">

<input id="email" type="email" placeholder="البريد الإلكتروني">

<input id="password" type="password" placeholder="كلمة المرور">


<button onclick="signup()">
إنشاء حساب
</button>


<button onclick="login()">
تسجيل الدخول
</button>


<p id="msg"></p>

</div>



<div class="menu">

<button onclick="openPage('الدروس')">
📚 الدروس
</button>


<button onclick="openPage('الاختبارات')">
📝 الاختبارات
</button>


<button onclick="openPage('الملف الشخصي')">
👨‍🎓 الملف الشخصي
</button>


</div>



<div class="page" id="page">

اختر من القائمة

</div>



</div>



<script>


const SUPABASE_URL =
"https://icpcthgueabxwwevowbt.supabase.co";


const SUPABASE_KEY =
"sb_publishable_rg857jiJ2tgqje-odQHZIQ_2Sd0UzbD";


const client =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



async function signup(){

let email =
document.getElementById("email").value;

let password =
document.getElementById("password").value;


let {error}=await client.auth.signUp({

email,
password

});


document.getElementById("msg").innerHTML =
error ? error.message :
"تم إنشاء الحساب";

}




async function login(){

let email =
document.getElementById("email").value;


let password =
document.getElementById("password").value;


let {error}=await client.auth.signInWithPassword({

email,
password

});


document.getElementById("msg").innerHTML =
error ? error.message :
"تم تسجيل الدخول";

}




function openPage(name){


let page =
document.getElementById("page");


if(name=="الدروس"){

page.innerHTML=
`
<h2>📚 الدروس</h2>
<p>سيتم إضافة دروس اللغة الإنجليزية هنا.</p>
`;

}


if(name=="الاختبارات"){

page.innerHTML=
`
<h2>📝 الاختبارات</h2>
<p>سيتم إضافة الاختبارات هنا.</p>
`;

}



if(name=="الملف الشخصي"){

page.innerHTML=
`
<h2>👨‍🎓 الملف الشخصي</h2>
<p>بيانات الطالب ستظهر هنا.</p>
`;

}


}


</script>


</body>
</html>
